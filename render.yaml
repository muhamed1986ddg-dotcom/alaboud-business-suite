databases:
  - name: alaboud-business-db
    region: virginia
    plan: free

services:
  - type: web
    name: alaboud-business-suite
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alaboud-business-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: JAD_CONNECTOR_MODE
        value: http
      - key: JAD_HTTP_FALLBACK
        value: "true"
      - key: PG_POOL_MAX
        value: "2"
      - key: PG_WRITE_RETRIES
        value: "3"
