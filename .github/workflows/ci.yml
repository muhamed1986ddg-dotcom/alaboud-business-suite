name: Project CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Block secrets and local data
        run: npm run check:sensitive
      - name: Install locked dependencies
        run: npm run install:all
      - name: Backend syntax
        run: npm run check --prefix backend
      - name: Backend test sweep
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-not-for-production
        run: npm run check:all-backend-tests
      - name: Backend selftest
        run: npm test --prefix backend
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: Current release and build gate
        run: npm run build
