name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Backend syntax check
        run: find backend/src backend/tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        run: |
          npm run check:all-backend-tests
          npm test --prefix backend
      - name: Run frontend tests
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Dependency audit
        run: |
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high
