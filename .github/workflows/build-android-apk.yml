name: Build Android Enterprise Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Unable to read Android version" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are required." >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/alaboud-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Align, sign and verify release APK
        id: apk
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          APK_NAME="alaboud-business-suite-v${{ steps.version.outputs.name }}-release.apk"
          mkdir -p artifacts
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/alaboud-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "${{ steps.signing.outputs.keystore }}" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "artifacts/$APK_NAME" \
            "$RUNNER_TEMP/alaboud-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "artifacts/$APK_NAME"
          APK_SIZE=$(du -h "artifacts/$APK_NAME" | cut -f1)
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          sha256sum "artifacts/$APK_NAME"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: alaboud-business-suite-v${{ steps.version.outputs.name }}-release-apk
          path: artifacts/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Android Signed Release APK"
            echo "- Version name: ${{ steps.version.outputs.name }}"
            echo "- Version code: ${{ steps.version.outputs.code }}"
            echo "- APK file: ${{ steps.apk.outputs.name }}"
            echo "- APK size: ${{ steps.apk.outputs.size }}"
          } >> "$GITHUB_STEP_SUMMARY"
