name: Build Android Enterprise APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Unable to read Android version" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare versioned APK
        id: apk
        shell: bash
        run: |
          APK_NAME="alaboud-business-suite-v${{ steps.version.outputs.name }}.apk"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/$APK_NAME"
          APK_SIZE=$(du -h "artifacts/$APK_NAME" | cut -f1)
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "Final APK: $APK_NAME"
          echo "APK size: $APK_SIZE"
          sha256sum "artifacts/$APK_NAME"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: alaboud-business-suite-v${{ steps.version.outputs.name }}-apk
          path: artifacts/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Android APK Build"
            echo "- Version name: ${{ steps.version.outputs.name }}"
            echo "- Version code: ${{ steps.version.outputs.code }}"
            echo "- APK file: ${{ steps.apk.outputs.name }}"
            echo "- APK size: ${{ steps.apk.outputs.size }}"
          } >> "$GITHUB_STEP_SUMMARY"
